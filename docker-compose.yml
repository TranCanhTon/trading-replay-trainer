services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: replay_trainer
      POSTGRES_PASSWORD: replayer_trainer_pw
      POSTGRES_DB: replay_trainer_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replay_trainer -d replay_trainer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://replay_trainer:replayer_trainer_pw@db:5432/replay_trainer_db
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        Vite_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  db_data:
